<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvejo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        html, body {

            background: #000;
