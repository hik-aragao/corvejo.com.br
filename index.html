<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corvejo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .background {
            position: relative;
            width: 100%;
            height: 100%;
            background-image: url("corvejo.jpg");
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
        }

        .instagram-link {
            position: absolute;
            left: 35%;
            top: 35%;
            width: 30%;
            height: 30%;
            display: block;
        }
    </style>
</head>

<body>

    <div class="background">
        <a
            href="https://www.instagram.com/corvejooficial/"
            target="_blank"
            class="instagram-link"
            aria-label="Instagram do Corvejo">
        </a>
    </div>

</body>
</html>
